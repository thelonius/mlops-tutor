<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MLOps Tutor</title>
    <!-- Inline-скрипт ставит data-theme ДО парсинга CSS — иначе FOUC
         (вспышка тёмного перед светлым на light-mode OS). -->
    <script>
      (function () {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- href подменяет useSystemTheme в зависимости от data-theme. -->
    <link id="hljs-css" rel="stylesheet" href="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
