name: Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Не разрешаем параллельные деплои — иначе ловим race на проде.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: pytest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -v

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    # Деплой только при push в main, не на PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app.py,curriculum.py,shares.py,requirements.txt,templates/,static/"
          target: /opt/mlops-tutor/
          strip_components: 0

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mlops-tutor
            docker compose restart app
            sleep 3
            docker compose logs app --tail=20

      # Анти-регресс: после деплоя сверяем md5 файлов на проде с тем,
      # что в текущем коммите main. Если разъезжается — значит кто-то
      # успел сделать scp поверх (либо что-то пошло не так с auto-deploy).
      # Это ловит ровно тот класс инцидентов, который у нас регулярно
      # повторялся: ручной scp с feature-веток затирал прод.
      #
      # Реализация: ОДИН ssh-вызов на весь whitelist. Раньше было 9
      # отдельных подключений, fail2ban на проде их троттлил и часть
      # падала по ConnectTimeout (run 25788858632 как пример).
      - name: Verify prod == main (md5)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ОДНО ssh-подключение, считаем все md5 одной командой.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" \
              "cd /opt/mlops-tutor && md5sum \
                app.py curriculum.py shares.py requirements.txt \
                templates/index.html \
                static/app.js static/style.css static/glossary.js static/share.js" \
              > prod_md5.txt

          md5sum \
            app.py curriculum.py shares.py requirements.txt \
            templates/index.html \
            static/app.js static/style.css static/glossary.js static/share.js \
            > local_md5.txt

          # Нормализуем: pwd-префиксы могут отличаться, оставляем только базовое имя.
          # Формат: '<md5>  <path>' → '<md5>  <path>'. Сортируем и diff'им.
          sort prod_md5.txt  > prod_md5.sorted
          sort local_md5.txt > local_md5.sorted

          echo "=== prod md5 ==="
          cat prod_md5.sorted
          echo "=== local md5 ==="
          cat local_md5.sorted
          echo "=== diff ==="
          if diff -u prod_md5.sorted local_md5.sorted; then
            echo "✅ Прод == main по всем 9 файлам."
          else
            echo ""
            echo "::error::Прод не равен main по md5."
            echo "::error::Возможные причины: кто-то делал scp вручную поверх auto-deploy,"
            echo "::error::либо предыдущий deploy шаг не докатил файлы."
            echo "::error::Перезапусти workflow (gh run rerun <id>) или проверь логи Copy шага."
            exit 1
          fi
