name: Deploy to production

# Прод переехал 28.08.2026 на общий VDS 31.130.130.11 (/root/mlops-tutor),
# рядом с gpx-tracker, ssd-radar и astro. Старый 91.84.112.120 (/opt/mlops-tutor)
# мёртв, следом отвалился и 176.123.166.252.
#
# TLS терминирует не наш Caddy, а общий ssd_radar_caddy из соседнего стека
# (/root/ssd-radar): порт 80 нужен ему для ACME HTTP-01, и второй Caddy на этой
# машине сертификат уже не выпишет. Наш compose поднимает только gunicorn.
# Публичный адрес: https://mlops-31-130-130-11.sslip.io:4443/
#
# Секреты SSH_HOST / SSH_USER / SSH_PRIVATE_KEY должны указывать на новый
# сервер и ключ cesium_replica_key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Не разрешаем параллельные деплои — иначе ловим race на проде.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: pytest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -v

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    # Деплой только при push в main, не на PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app.py,curriculum.py,shares.py,vacancy_provider.py,requirements.txt,static/,data/tts_terms.tsv,data/jobs_warehouse.sqlite,data/topic_vectors.json,deploy/"
          target: /root/mlops-tutor/
          strip_components: 0

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/mlops-tutor/deploy
            echo "=== data/ on host ==="
            ls -lh ../data/ || echo "no data/ dir"
            echo "=== data/ in container ==="
            docker compose -f docker-compose.server.yml exec -T mlops_app ls -lh /app/data/ || echo "no /app/data in container"
            docker compose -f docker-compose.server.yml restart mlops_app
            sleep 5
            docker compose -f docker-compose.server.yml logs mlops_app --tail=20
            echo "=== smoke ==="
            curl -sf -o /dev/null -w "GET / -> %{http_code}\n" --max-time 20 \
              https://mlops-31-130-130-11.sslip.io:4443/

      # Анти-регресс: после деплоя сверяем md5 файлов на проде с тем,
      # что в текущем коммите main. Если разъезжается — значит кто-то
      # успел сделать scp поверх (либо что-то пошло не так с auto-deploy).
      # Это ловит ровно тот класс инцидентов, который у нас регулярно
      # повторялся: ручной scp с feature-веток затирал прод.
      #
      # Реализация: ОДИН ssh-вызов на весь whitelist. Раньше было 9
      # отдельных подключений, fail2ban на проде их троттлил и часть
      # падала по ConnectTimeout (run 25788858632 как пример).
      - name: Verify prod == main (md5)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Бэкенд + dist/index.html. Хешированные ассеты НЕ проверяем —
          # их имена содержат content-hash, а index.html ссылается на
          # актуальные. Поломка в bundle => другое имя ассета => другой
          # md5 у index.html => этот шаг упадёт. На проде могут лежать
          # старые ассеты от прошлых деплоев — это безвредный мусор,
          # никто на них не ссылается. Если когда-то начнёт мешать,
          # добавим отдельный шаг prune через `find -mtime`.
          FILES="app.py curriculum.py shares.py vacancy_provider.py requirements.txt static/dist/index.html data/tts_terms.tsv data/jobs_warehouse.sqlite data/topic_vectors.json"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" \
              "cd /root/mlops-tutor && md5sum $FILES" \
              > prod_md5.txt

          md5sum $FILES > local_md5.txt

          sort prod_md5.txt  > prod_md5.sorted
          sort local_md5.txt > local_md5.sorted

          echo "=== prod md5 ==="
          cat prod_md5.sorted
          echo "=== local md5 ==="
          cat local_md5.sorted
          echo "=== diff ==="
          if diff -u prod_md5.sorted local_md5.sorted; then
            echo "✅ Прод == main по всем $(echo $FILES | wc -w) файлам."
          else
            echo ""
            echo "::error::Прод не равен main по md5."
            echo "::error::Возможные причины: кто-то делал scp вручную поверх auto-deploy,"
            echo "::error::либо предыдущий deploy шаг не докатил файлы."
            echo "::error::Перезапусти workflow (gh run rerun <id>) или проверь логи Copy шага."
            exit 1
          fi
