name: Deploy to production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Не разрешаем параллельные деплои — иначе ловим race на проде.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: pytest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -v

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    # Деплой только при push в main, не на PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app.py,curriculum.py,shares.py,requirements.txt,templates/,static/"
          target: /opt/mlops-tutor/
          strip_components: 0

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mlops-tutor
            docker compose restart app
            sleep 3
            docker compose logs app --tail=20

      # Анти-регресс: после деплоя сверяем md5 файлов на проде с тем,
      # что в текущем коммите main. Если разъезжается — значит кто-то
      # успел сделать scp поверх (либо что-то пошло не так с auto-deploy).
      # Это ловит ровно тот класс инцидентов, который у нас регулярно
      # повторялся: ручной scp с feature-веток затирал прод.
      - name: Verify prod == main (md5)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          FILES="app.py curriculum.py shares.py requirements.txt templates/index.html"
          FILES="$FILES static/app.js static/style.css static/glossary.js static/share.js"

          fail=0
          for f in $FILES; do
            local_md5=$(md5sum "$f" | awk '{print $1}')
            prod_md5=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" "md5sum /opt/mlops-tutor/$f" | awk '{print $1}')
            if [ "$local_md5" = "$prod_md5" ]; then
              echo "✅ $f  ($local_md5)"
            else
              echo "❌ $f  local=$local_md5  prod=$prod_md5"
              fail=1
            fi
          done

          if [ "$fail" = "1" ]; then
            echo ""
            echo "::error::Прод не равен main по md5. Это означает что кто-то"
            echo "::error::делал scp вручную ИЛИ deploy шаг не докатил файлы."
            echo "::error::Перезапусти workflow или проверь логи deploy шага выше."
            exit 1
          fi
