# Сайт-блок MLOps Tutor для ХОСТОВОГО Caddy (стек gpx-tracker,
# /root/cesium-route-renderer/gpx-tracker/Caddyfile). Этот Caddy владеет
# хостовым :443, который хостер пропускает снаружи. Порт 4443, на котором наш
# сайт жил через ssd_radar_caddy, провайдер режет до сервера: внешние пробы из
# RU/DE/NL получают таймаут, а SYN на :4443 не доходит даже до eth0.
#
# Вставляется deploy/sync_host_caddy.sh между маркерами, чужие блоки (VPN,
# ssd-radar, quickbarn) не трогаем.
#
# Порт 80 занят ssd_radar_caddy, поэтому HTTP-01 недоступен — только TLS-ALPN.
#
# Апстрим адресуем по container_name, а не по имени compose-сервиса: хостовый
# Caddy сидит в нескольких внешних сетях, и имя сервиса там может совпасть с
# чужим (28.08.2026 так упал ssd-radar). Контейнер для этого подключён к сети
# ssd_edge, общей с gpx-tracker-caddy.
mlops-31-130-130-11.sslip.io {
    encode zstd gzip

    # /api/chat отдаёт SSE. Caddy сам сбрасывает буфер для text/event-stream,
    # но явный flush_interval -1 не даёт стриму зависнуть за gzip.
    reverse_proxy mlops_tutor_app:8080 {
        flush_interval -1
    }

    tls {
        issuer acme {
            disable_http_challenge
        }
    }

    header {
        Strict-Transport-Security "max-age=31536000;"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }

    # Бандл с хешем в имени кешируем навсегда, HTML-оболочку нельзя: она
    # ссылается на конкретные имена файлов сборки.
    header /static/dist/assets/* Cache-Control "public, max-age=31536000, immutable"
}
