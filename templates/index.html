<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>MLOps Tutor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link id="hljs-css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/glossary.js"></script>
<script src="/static/share.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="tooltip"></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <div>
      <h1>MLOps Tutor</h1>
      <p>Wildberries · Senior MLOps</p>
    </div>
  </div>

  <div class="mode-section">
    <div class="section-label">Режим</div>
    <button class="mode-btn active" id="mode-learn" onclick="setMode('learn')">
      <span class="mode-icon">📖</span> Объяснение
    </button>
    <button class="mode-btn" id="mode-quiz" onclick="setMode('quiz')">
      <span class="mode-icon">🧠</span> Квиз
    </button>
    <button class="mode-btn" id="mode-mock" onclick="setMode('mock')">
      <span class="mode-icon">🎯</span> Mock Interview
    </button>
    <button class="mode-btn" id="mode-cheatsheet" onclick="setMode('cheatsheet')">
      <span class="mode-icon">📋</span> Чит-шит
    </button>
    <button class="mode-btn" id="mode-mcquiz" onclick="setMode('mcquiz')">
      <span class="mode-icon">🎯</span> Тест
    </button>
    <button class="mode-btn" id="mode-lecture" onclick="setMode('lecture')">
      <span class="mode-icon">🎧</span> Лекция
    </button>
  </div>

  <div class="curriculum" id="curriculum-tree"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="chat-header">
    <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleDesktopSidebar()" title="Свернуть меню">◀</button>
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Меню">☰</button>
    <span class="header-topic" id="header-topic">Выбери тему →</span>
    <select id="model-select" title="Модель" onchange="savePreferredModel(this.value)">
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
      <option value="qwen/qwen3-32b">Qwen3 32B</option>
      <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
      <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout</option>
      <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
      <option value="gemma-4-31b-it">Gemma 4 31B</option>
      <option value="gemma-4-26b-a4b-it">Gemma 4 26B</option>
    </select>
    <span class="mode-badge badge-learn" id="mode-badge">Объяснение</span>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-arrow">←</div>
      <h2>Выбери тему слева</h2>
      <p>Начни с первой недели — Контейнеры и Docker. Каждая тема объясняется с нуля, с аналогиями и примерами кода.</p>
    </div>
  </div>

  <div id="cheatsheet-view" style="display:none; overflow-y:auto; padding:16px; flex:1;"></div>
  <div id="mcquiz-view" style="display:none; flex:1; overflow-y:auto;"></div>

  <div class="quick-area" id="quick-area"></div>

  <div class="input-area" id="input-row">
    <div class="input-wrap">
      <textarea
        id="user-input"
        placeholder="Напиши вопрос или ответ... (Enter — отправить, Shift+Enter — новая строка)"
        rows="1"
        onkeydown="onKey(event)"
        oninput="resize(this)"
      ></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="send()" title="Отправить">↑</button>
    <button class="mic-btn" id="mic-btn" title="Держи для записи" onmousedown="micStart()" onmouseup="micStop()" ontouchstart="micStart(event)" ontouchend="micStop()">🎙</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
